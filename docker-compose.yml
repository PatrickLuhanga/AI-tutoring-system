services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_tutoring_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutor_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutoring}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ai_tutoring_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutor_admin} -d ${POSTGRES_DB:-ai_tutoring}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ai_tutoring_pgdata:
