<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hybrid AI Tutoring System" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>AI Tutoring System &mdash; Client Tier</title>

    <!--
      Resolve the theme before first paint.

      This has to run as a blocking inline script in <head>, not from a React
      effect: React mounts after the stylesheet has already painted, so anything
      later shows the light theme for a frame or two. That flash is why people
      abandon dark mode, and it is most obvious to exactly the users who chose
      dark because they dislike bright screens.

      Deliberately tiny and dependency-free. It mirrors the resolution rules in
      src/state/theme.tsx; keep the two in step.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dut-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          // Storage blocked or matchMedia missing. The default light theme on
          // <html> is a fine outcome; do not let this break the page.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
